security:
    # https://symfony.com/doc/current/security.html#registering-the-user-hashing-passwords
    # Password hashers para la entidad User(Requerido aunque usemos OAuth)
    password_hashers:
        App\Entity\User: 'auto'
    providers:
        app_user_provider:
            entity:
                class: App\Entity\User
                property: email
    firewalls:
        dev:
            pattern: ^/(_(profiler|wdt)|css|images|js)/
            security: false
        # Firewall con sesión para el flujo OAuth.
        # knpu/oauth2-client-bundle guarda el nonce "state" en la sesión PHP
        # entre /auth/google y /auth/google/callback. Si este firewall fuera
        # stateless la sesión no persiste y Google devuelve "Invalid state".
        oauth:
            pattern: ^/auth
            stateless: false
            security: false
        # Firewall de la API: stateless porque usa JWT, no sesiones
        main:
            stateless: true
            provider: app_user_provider
            jwt: ~

    # Control de acceso
    access_control:
        # Endpoint de refresh token debe ser público (se llama cuando el JWT expiró)
        - { path: ^/api/token/refresh, roles: PUBLIC_ACCESS }
        # Endpoints de desarrollo (solo disponibles en APP_ENV=dev)
        - { path: ^/api/dev, roles: PUBLIC_ACCESS }
        #Rutas públicas (OAuth login y callback)
        - { path: ^/auth, roles: PUBLIC_ACCESS }
        #Rutas privadas (requieren JWT Válido)
        - { path: ^/api, roles: ROLE_USER }

when@test:
    security:
        password_hashers:
            # By default, password hashers are resource intensive and take time. This is
            # important to generate secure password hashes. In tests however, secure hashes
            # are not important, waste resources and increase test times. The following
            # reduces the work factor to the lowest possible values.
            Symfony\Component\Security\Core\User\PasswordAuthenticatedUserInterface:
                algorithm: auto
                cost: 4 # Lowest possible value for bcrypt
                time_cost: 3 # Lowest possible value for argon
                memory_cost: 10 # Lowest possible value for argon
