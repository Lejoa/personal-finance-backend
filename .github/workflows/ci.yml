name: CI

on:
  push:
    branches:
      - main
  pull_request: ~
  workflow_dispatch: ~

concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  tests:
    name: Tests
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Build Docker images
        uses: docker/bake-action@v6
        with:
          pull: true
          load: true
          files: |
            compose.yaml
            compose.override.yaml
          set: |
            *.cache-from=type=gha,scope=${{github.ref}}
            *.cache-from=type=gha,scope=refs/heads/main
            *.cache-to=type=gha,scope=${{github.ref}},mode=max
      -
        name: Create external network
        run: docker network create finance-network || true
      -
        name: Generate JWT keys
        env:
          JWT_PASSPHRASE: change-me-run-openssl-rand-hex-32
        run: |
          mkdir -p config/jwt
          openssl genpkey -algorithm RSA -pkeyopt rsa_keygen_bits:4096 \
            -pass pass:${JWT_PASSPHRASE} -out config/jwt/private.pem
          openssl pkey -in config/jwt/private.pem -passin pass:${JWT_PASSPHRASE} \
            -pubout -out config/jwt/public.pem
      -
        name: Start services
        run: docker compose up --wait --no-build
      -
        name: Check HTTP reachability
        run: curl -v --fail-with-body http://localhost/health
      -
        name: Check HTTPS reachability
        run: curl -v --insecure --fail-with-body https://localhost/health
      -
        name: Check Mercure reachability
        run: curl -vI --insecure --fail-with-body https://localhost/.well-known/mercure?topic=test
      -
        name: Run migrations
        run: docker compose exec -T php bin/console doctrine:migrations:migrate --no-interaction
      -
        name: Doctrine Schema Validator
        # --skip-sync: the DB has pgvector-specific objects (IVFFlat index, COLLATE "C")
        # that Doctrine cannot represent in entity mappings. Mapping validation still runs.
        run: docker compose exec -T php bin/console doctrine:schema:validate --skip-sync
      -
        name: Run PHPUnit
        run: docker compose exec -T php vendor/bin/phpunit
      # Security audit disabled for pilot project
      # -
      #   name: Security audit
      #   run: docker compose exec -T php composer audit

  lint:
    name: Docker Lint
    runs-on: ubuntu-latest
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Lint Dockerfile
        uses: hadolint/hadolint-action@v3.1.0
