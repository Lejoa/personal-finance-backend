name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

jobs:
  build-and-push:
    name: Build and push Docker image
    runs-on: ubuntu-latest
    if: ${{ github.event.workflow_run.conclusion == 'success' }}
    steps:
      -
        name: Checkout
        uses: actions/checkout@v4
      -
        name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3
      -
        name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      -
        name: Build and push production image
        uses: docker/build-push-action@v6
        with:
          context: .
          target: frankenphp_prod
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/finance-backend:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/finance-backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  deploy:
    name: Deploy to production server
    runs-on: ubuntu-latest
    needs: build-and-push
    steps:
      -
        name: Deploy via SSH
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            set -e
            cd /opt/finance-app/personal-finance-infra

            # Write JWT keys from GitHub secrets (stored as base64)
            mkdir -p ../personal-finance-backend/config/jwt
            echo "${{ secrets.JWT_PRIVATE_KEY }}" | base64 -d > ../personal-finance-backend/config/jwt/private.pem
            echo "${{ secrets.JWT_PUBLIC_KEY }}"  | base64 -d > ../personal-finance-backend/config/jwt/public.pem
            chmod 600 ../personal-finance-backend/config/jwt/private.pem

            # Pull latest image and recreate only the backend container
            docker compose -f docker-compose.prod.yml --env-file .env.prod pull php
            docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --no-deps php

            # Run pending migrations
            docker compose -f docker-compose.prod.yml --env-file .env.prod exec -T php \
              bin/console doctrine:migrations:migrate --no-interaction --all-or-nothing

            # Remove images no longer referenced by any container (old :latest/:sha layers
            # from previous deploys) — the VPS has limited disk and this accumulates fast.
            docker image prune -af
